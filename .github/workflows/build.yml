# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Pinned rather than ubuntu-latest: the produced binaries carry the glibc
    # of whatever image builds them, so a silent move of `latest` to a newer
    # Ubuntu would make the artifacts refuse to start on 24.04-based systems
    # (Zorin OS 18, Linux Mint 22, Ubuntu 24.04 itself).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      # Run the unit and widget tests before the packaging steps: they need no
      # GTK toolchain and finish in seconds, so a broken change fails here
      # rather than after a full desktop build.
      #
      # `flutter analyze` is deliberately not run: it exits non-zero on info
      # and warning level lint findings, and the tree carries a large number of
      # pre-existing ones. Adding it today would fail every build on issues
      # unrelated to the change under test.
      - run: flutter pub get
      - run: flutter test
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y ninja-build libgtk-3-dev libkeybinder-3.0-0 libkeybinder-3.0-dev rpm mesa-utils
      - run: flutter config --enable-linux-desktop
      - run: bash build-deb.sh
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-assistant-deb
          path: linux-assistant.deb
      - run: bash build-rpm.sh
      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-assistant-rpm
          path: /home/runner/rpmbuild/RPMS/x86_64/

